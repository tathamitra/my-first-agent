name: Jira Agent Flow

on:
  repository_dispatch:
    types: [jira-ticket-created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  create-copilot-task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Print Jira Payload
        run: |
          echo "Issue Key:"
          echo "${{ github.event.client_payload.issue_key }}"

          echo "Summary:"
          echo "${{ github.event.client_payload.summary }}"

      - name: Read Agent Instructions
        run: |
          cat .github/agents/developer.agent.md

      - name: Create GitHub Issue
        run: |
          gh issue create \
            --title "${{ github.event.client_payload.summary }}" \
            --body "
          Jira Issue: ${{ github.event.client_payload.issue_key }}

          Task:
          ${{ github.event.client_payload.summary }}

          Please implement this following the developer agent instructions.
          "
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
