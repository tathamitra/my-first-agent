name: Jira Agent Flow

on:
  repository_dispatch:
    types: [jira-ticket-created]

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Print Jira Payload
        run: |
          echo "Issue:"
          echo "${{ github.event.client_payload.summary }}"

      - name: Read Agent Instructions
        run: |
          cat .agents/developer.md

      - name: Create Branch
        run: |
          git checkout -b feature-${{ github.run_number }}

      - name: Modify README
        run: |
          echo "" >> README.md
          echo "## Jira Automation Test" >> README.md
          echo "${{ github.event.client_payload.summary }}" >> README.md

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add .

          git commit -m "Automated update from Jira"

      - name: Push Branch
        run: |
          git push origin HEAD

      - name: Create Pull Request
        run: |
          gh pr create \
            --title "Automation: ${{ github.event.client_payload.summary }}" \
            --body "This PR was automatically created from Jira dispatch."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
